<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="An eight-page introduction to Retold’s ecology, with Survival essentials and three Creative experiments for Klei.">
<title>Retold — A living-world field guide</title>
<style>
@page { size: A4; margin: 0; }
:root {
  --ink: #253b32;
  --green: #345e46;
  --muted: #657469;
  --line: #d3dccf;
  --pale: #f0f4ea;
  --clay: #a26444;
}
* { box-sizing: border-box; }
html { background: #e6e9e1; color: var(--ink); }
body {
  margin: 0;
  font: 10.1pt/1.43 "Atkinson Hyperlegible Next", "DejaVu Sans", sans-serif;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
a { color: #315f45; text-underline-offset: 2px; }
p { margin: 0 0 2.8mm; orphans: 3; widows: 3; }
h1, h2, h3 { color: var(--green); break-after: avoid; }
h1 { font: 700 66pt/1.05 "DejaVu Serif", serif; letter-spacing: -2pt; margin: 2mm 0; }
h2 { font: 700 27pt/1.15 "DejaVu Serif", serif; letter-spacing: -.6pt; margin: 1mm 0 6mm; }
h3 { font-size: 12pt; line-height: 1.25; margin: 5mm 0 2mm; }
strong { font-weight: 700; }
ul, ol { margin: 0 0 3mm; padding-left: 5mm; }
li { margin: 1.5mm 0; padding-left: .6mm; }
table { width: 100%; border-collapse: collapse; margin: 3mm 0 4mm; font-size: 9.6pt; line-height: 1.35; }
thead { display: table-header-group; }
th, td { padding: 2.5mm 2.6mm; border-bottom: 1px solid var(--line); vertical-align: top; }
th { text-align: left; background: var(--pale); color: var(--green); }
tbody tr:last-child td { border-bottom: 2px solid var(--line); }
tr, figure, .note, .flow, .timeline, .recipe-grid { break-inside: avoid; }
code { font: .92em "DejaVu Sans Mono", monospace; overflow-wrap: anywhere; }
pre { background: var(--pale); padding: 2mm; line-height: 1.6; margin: 2mm 0 0; white-space: pre-wrap; }
pre code { font-size: 8pt; white-space: pre; }
.sheet {
  width: 210mm;
  height: 297mm;
  padding: 13mm 17mm 11mm;
  background: #fffefa;
  display: flex;
  flex-direction: column;
  break-after: page;
}
.sheet:last-child { break-after: auto; }
.running-head { display: flex; justify-content: space-between; color: var(--muted); font-size: 7.5pt; letter-spacing: 1.1pt; padding-bottom: 3mm; margin-bottom: 8mm; border-bottom: 1px solid var(--line); }
.running-head strong { color: var(--green); }
.page-content { flex: 1; min-height: 0; }
.page-footer { display: flex; justify-content: space-between; gap: 5mm; padding-top: 3mm; margin-top: 5mm; border-top: 1px solid var(--line); color: var(--muted); font-size: 7.3pt; }
.page-footer a { color: inherit; }
.page-number { font-size: 9pt; color: var(--green); font-weight: 700; }
.eyebrow { text-transform: uppercase; color: var(--clay); font-size: 8pt; font-weight: 700; letter-spacing: 1.2pt; margin-bottom: 4mm; }
.subtitle { font: 400 21pt/1.3 "DejaVu Serif", serif; color: var(--green); margin-bottom: 9mm; }
.note { display: block; background: var(--pale); border-left: 3px solid #84996b; padding: 3mm 4mm; margin: 4mm 0; font-size: 9.5pt; line-height: 1.43; }
.edition { color: var(--muted); font-size: 8pt; padding-top: 4mm; margin-top: 5mm; border-top: 1px solid var(--line); }
.flow { display: flex; align-items: center; gap: 2mm; margin: 5mm 0; }
.flow span { flex: 1; text-align: center; background: var(--pale); border-top: 3px solid #91a477; padding: 4mm 2mm; font-weight: 700; line-height: 1.3; font-size: 10pt; }
.flow b { color: var(--clay); font-size: 16pt; font-weight: 400; }
.timeline { margin: 6mm 0; border-block: 1px solid var(--line); padding: 5mm 3mm; display: flex; align-items: center; gap: 4mm; }
.timeline strong { flex: 1; font-size: 11pt; }
.timeline span { flex: 1.4; color: var(--muted); text-align: center; font-size: 9pt; border-block: 2px solid #91a477; padding: 3mm 1mm; }
.recipe-grid { display: flex; gap: 3mm; margin: 4mm 0; }
.recipe-grid > div { flex: 1; min-width: 0; }
.recipe-grid p { font-size: 8.6pt; margin-bottom: 1mm; }
.reference-shot { margin: 4mm 0; }
.reference-shot img { width: 100%; height: 62mm; object-fit: contain; background: #e7ece1; display: block; }
figcaption { font-size: 7.8pt; line-height: 1.35; color: var(--muted); margin-top: 2mm; }
.closing { color: var(--green); border-top: 2px solid #84996b; padding-top: 4mm; margin-top: 5mm; }
#getting-started .page-content { font-size: 9.5pt; line-height: 1.4; }
#getting-started li { margin: 1.3mm 0; }
#playground .page-content { font-size: 9.7pt; line-height: 1.4; }
#playground table { font-size: 8.8pt; }
#playground th, #playground td { padding-block: 1.7mm; }
#playground h3 { margin-top: 4mm; }
#further-exploration .page-content { font-size: 9.7pt; }
.screen-nav { max-width: 210mm; margin: 20px auto; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 10pt; }
.screen-nav a { white-space: nowrap; }
@media screen {
  .sheet { margin: 20px auto; box-shadow: 0 4px 24px #253b3216; }
}
@media screen and (max-width: 820px) {
  .sheet { width: calc(100% - 24px); height: auto; min-height: 0; padding: 24px; }
  .page-content { min-height: auto; }
  .running-head { font-size: 7pt; gap: 12px; }
  .page-footer { margin-top: 25px; }
  h1 { font-size: 54pt; }
  h2 { font-size: 24pt; }
  .recipe-grid { flex-wrap: wrap; }
  .recipe-grid > div { flex-basis: 160px; }
  .flow { gap: 4px; }
  .flow span { font-size: 8.5pt; }
  .timeline { flex-wrap: wrap; }
  table { font-size: 8.8pt; }
  #playground table { font-size: 8pt; }
  .screen-nav { margin-inline: 12px; padding-inline: 12px; }
}
@media print {
  html { background: white; }
  .screen-nav { display: none; }
  a { text-decoration: none; }
}
</style>
</head>
<body>
<nav class="screen-nav" aria-label="Guide pages">@@NAV@@</nav>
<main>@@PAGES@@</main>
</body>
</html>
